task: mc_local
dataset_path: json
dataset_kwargs:
  data_files:
    test: /tmp/fx/mc.json
output_type: multiple_choice
test_split: test
doc_to_text: 'Question: {{question}}

  Answer:'
doc_to_target: '{{label}}'
doc_to_choice: '{{choices}}'
metric_list:
- metric: acc
  aggregation: mean
  higher_is_better: true
- metric: acc_norm
  aggregation: mean
  higher_is_better: true
